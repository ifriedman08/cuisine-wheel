<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuisine Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: wheel is the hero on the left; the editable menu of cuisines sits beside it (stacks on phones). */
  :root {
    --bg: #14161f;
    --panel: #1d2030;
    --line: #2c3046;
    --fg: #f3efe6;
    --muted: #9a9cb3;
    --accent: #ffb238;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(ellipse at 30% 0%, #23263a 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--fg);
    font: 16px/1.5 var(--body);
    min-height: 100vh;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app {
    max-width: 1040px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    gap: 40px;
    align-items: start;
  }
  @media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); gap: 32px; } }

  header h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  header p { margin: 0; color: var(--muted); }

  .stage { display: flex; flex-direction: column; gap: 24px; align-items: center; }
  .stage header { align-self: stretch; }

  .wheel-wrap {
    position: relative;
    width: min(100%, 520px);
    aspect-ratio: 1;
    max-width: 100%;
  }
  .wheel-wrap canvas {
    width: 100%; height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 0 0 8px var(--panel), 0 0 0 10px var(--line), 0 30px 60px rgba(0,0,0,.45);
    will-change: transform;
  }
  .pointer {
    position: absolute;
    top: -14px; left: 50%;
    width: 34px; height: 44px;
    transform: translateX(-50%);
    transform-origin: 50% 20%;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.5));
    z-index: 2;
  }
  .pointer.flick { animation: flick 120ms ease-out; }
  @keyframes flick { 40% { transform: translateX(-50%) rotate(-18deg); } }

  .hub {
    position: absolute; inset: 0; margin: auto;
    width: 26%; aspect-ratio: 1;
    border-radius: 50%;
    border: 0;
    background: var(--fg);
    color: var(--bg);
    font: 800 clamp(1rem, 3.2vw, 1.5rem)/1 var(--display);
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 0 0 6px var(--bg), 0 8px 20px rgba(0,0,0,.4);
    transition: transform .15s ease, background .15s ease;
  }
  .hub:hover:not(:disabled) { transform: scale(1.05); background: var(--accent); }
  .hub:disabled { cursor: default; opacity: .9; }
  .hub:focus-visible { outline: 3px solid var(--accent); outline-offset: 8px; }

  .result {
    min-height: 4.5rem;
    text-align: center;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  .result .label { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .result .pick {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1;
    color: var(--accent);
  }
  .result .pick.pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* side panel */
  .menu {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    display: flex; flex-direction: column; gap: 20px;
    min-width: 0;
  }
  .menu h2 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; }
  .menu .sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit;
  }
  .add input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button.btn {
    font: 700 .9rem var(--body);
    border-radius: 10px; border: 1px solid var(--line);
    padding: 10px 14px; cursor: pointer;
    background: var(--fg); color: var(--bg);
  }
  button.btn.ghost { background: transparent; color: var(--fg); }
  button.btn:hover { border-color: var(--accent); }
  button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 6px 6px 12px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: .92rem;
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.off { opacity: .45; }
  .chip.off .name { text-decoration: line-through; }
  .chip button {
    border: 0; background: transparent; color: var(--muted);
    width: 24px; height: 24px; border-radius: 50%;
    cursor: pointer; font-size: 16px; line-height: 1;
  }
  .chip button:hover { background: var(--line); color: var(--fg); }
  .chip button:focus-visible { outline: 2px solid var(--accent); }
  .chip .name { cursor: pointer; }

  .options { display: flex; flex-direction: column; gap: 10px; font-size: .92rem; }
  .options label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .options input { accent-color: var(--accent); width: 18px; height: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: .82rem; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .pointer.flick, .result .pick.pop { animation: none; }
  }
</style>
</head>
<body>
<main class="app">
  <section class="stage">
    <header>
      <h1>What are we eating?</h1>
      <p>Spin once. No arguing with the wheel.</p>
    </header>

    <div class="wheel-wrap">
      <svg class="pointer" id="pointer" viewBox="0 0 34 44" aria-hidden="true">
        <path d="M17 44 L2 10 A15 15 0 1 1 32 10 Z" fill="#f3efe6"/>
        <circle cx="17" cy="14" r="5" fill="#14161f"/>
      </svg>
      <canvas id="wheel" aria-label="Cuisine wheel" role="img"></canvas>
      <button class="hub" id="spin" type="button">SPIN</button>
    </div>

    <div class="result" aria-live="polite">
      <span class="label" id="resultLabel">Tonight's pick</span>
      <span class="pick" id="pick">—</span>
    </div>
  </section>

  <aside class="menu">
    <div>
      <h2>On the wheel</h2>
      <p class="sub">Tap a name to sit it out tonight. × removes it for good.</p>
    </div>

    <form class="add" id="addForm" autocomplete="off">
      <input id="addInput" type="text" placeholder="Add a cuisine or a restaurant" maxlength="28" aria-label="Add a cuisine or restaurant">
      <button class="btn" type="submit">Add</button>
    </form>

    <ul class="list" id="list"></ul>

    <div class="options">
      <label><input type="checkbox" id="optRemove"> Take the winner off after each spin</label>
      <label><input type="checkbox" id="optSound" checked> Ticking sound</label>
    </div>

    <div class="row">
      <button class="btn ghost" type="button" id="restore">Bring everything back</button>
      <button class="btn ghost" type="button" id="reset">Reset to defaults</button>
    </div>
    <p class="hint" id="count"></p>
  </aside>
</main>

<script>
(() => {
  const DEFAULTS = ["Chipotle", "Señor Sisig", "Pupusas", "Chinese", "Japanese", "Thai",
    "Burmese", "Indian", "Pizza", "Burgers", "Mediterranean"];
  const PALETTE = ["#ff6b4a", "#ffb238", "#3ec7a5", "#4f8bff", "#c46bff", "#ff5c9a", "#9bd14b", "#2fb7d6"];
  const KEY = "cuisine-wheel-v2";

  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } },
    save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
  };

  const saved = store.load();
  const state = {
    items: saved?.items?.length ? saved.items : DEFAULTS.map(name => ({ name, on: true })),
    removeWinner: !!saved?.removeWinner,
    sound: saved?.sound ?? true,
  };
  const persist = () => store.save(state);

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");
  const spinBtn = $("spin"), pickEl = $("pick"), labelEl = $("resultLabel");
  const pointer = $("pointer");
  let rotation = 0;          // degrees, clockwise, cumulative
  let spinning = false;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const active = () => state.items.filter(i => i.on);
  const colorFor = (idx, n) => {
    let c = idx % PALETTE.length;
    // avoid the last slice matching the first
    if (n > 1 && idx === n - 1 && c === 0) c = (c + 1) % PALETTE.length;
    return PALETTE[c];
  };

  // ---- drawing ----
  function sizeCanvas() {
    const px = canvas.clientWidth * (window.devicePixelRatio || 1);
    canvas.width = canvas.height = Math.round(px);
    draw();
  }

  function draw() {
    const items = active();
    const n = items.length;
    const W = canvas.width, r = W / 2;
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.translate(r, r);

    if (!n) {
      ctx.fillStyle = "#1d2030";
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return;
    }

    const seg = (Math.PI * 2) / n;
    const fontPx = Math.max(11, Math.min(r * 0.085, (r * 0.9) / Math.max(4, n) * 1.6));
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + i * seg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = colorFor(i, n);
      ctx.fill();
      ctx.strokeStyle = "rgba(20,22,31,.35)";
      ctx.lineWidth = Math.max(1, r * 0.006);
      ctx.stroke();

      // label along the radius
      ctx.save();
      ctx.rotate(a0 + seg / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#14161f";
      ctx.font = `700 ${fontPx}px "DM Sans", system-ui, sans-serif`;
      let label = items[i].name;
      const maxW = r * 0.62;
      while (ctx.measureText(label).width > maxW && label.length > 3) label = label.slice(0, -2) + "…";
      ctx.fillText(label, r * 0.92, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  const applyRotation = () => { canvas.style.transform = `rotate(${rotation}deg)`; };

  // ---- sound ----
  let audio;
  function tick() {
    if (!state.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = 1400;
      g.gain.setValueAtTime(0.05, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.03);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.035);
    } catch {}
  }
  function flick() {
    pointer.classList.remove("flick");
    void pointer.offsetWidth;
    pointer.classList.add("flick");
  }

  // ---- spinning ----
  const easeOut = t => 1 - Math.pow(1 - t, 4);

  function spin() {
    const items = active();
    if (spinning || items.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;
    labelEl.textContent = "Spinning…";
    pickEl.textContent = "…";

    const n = items.length, segDeg = 360 / n;
    const winner = Math.floor(Math.random() * n);
    // wheel angle (from top, clockwise) that should end under the pointer
    const jitter = (Math.random() - 0.5) * segDeg * 0.7;
    const targetAngle = winner * segDeg + segDeg / 2 + jitter;
    const targetMod = ((-targetAngle % 360) + 360) % 360;
    const curMod = ((rotation % 360) + 360) % 360;
    const turns = reduceMotion ? 1 : 6 + Math.floor(Math.random() * 3);
    const delta = turns * 360 + ((targetMod - curMod + 360) % 360);

    const start = rotation, duration = reduceMotion ? 900 : 5200;
    const t0 = performance.now();
    let lastSeg = Math.floor((((-start % 360) + 360) % 360) / segDeg);

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      rotation = start + delta * easeOut(t);
      applyRotation();
      const under = Math.floor((((-rotation % 360) + 360) % 360) / segDeg);
      if (under !== lastSeg) { lastSeg = under; tick(); if (!reduceMotion) flick(); }
      if (t < 1) requestAnimationFrame(frame);
      else finish(items[winner]);
    }
    requestAnimationFrame(frame);
  }

  function finish(item) {
    labelEl.textContent = "Tonight's pick";
    pickEl.textContent = item.name;
    pickEl.classList.remove("pop"); void pickEl.offsetWidth; pickEl.classList.add("pop");
    spinning = false;
    spinBtn.disabled = false;
    if (state.removeWinner) {
      item.on = false;
      persist();
      // keep the wheel still visually: redraw after a beat so the result registers first
      setTimeout(() => { renderList(); draw(); }, 1400);
    }
  }

  // ---- list editing ----
  function renderList() {
    const list = $("list");
    list.innerHTML = "";
    const on = active();
    state.items.forEach((item, idx) => {
      const li = document.createElement("li");
      li.className = "chip" + (item.on ? "" : " off");
      const dot = document.createElement("span");
      dot.className = "dot";
      const pos = on.indexOf(item);
      dot.style.background = pos >= 0 ? colorFor(pos, on.length) : "#555a74";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      name.title = item.on ? "Sit this one out" : "Put back on the wheel";
      name.tabIndex = 0;
      name.setAttribute("role", "button");
      const toggle = () => { if (spinning) return; item.on = !item.on; persist(); renderList(); draw(); };
      name.addEventListener("click", toggle);
      name.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      const del = document.createElement("button");
      del.type = "button";
      del.textContent = "×";
      del.setAttribute("aria-label", `Remove ${item.name}`);
      del.addEventListener("click", () => {
        if (spinning) return;
        state.items.splice(idx, 1); persist(); renderList(); draw();
      });
      li.append(dot, name, del);
      list.append(li);
    });
    const n = on.length;
    $("count").textContent = n < 2
      ? "Put at least two options on the wheel to spin."
      : `${n} on the wheel${state.items.length > n ? `, ${state.items.length - n} sitting out` : ""}.`;
    spinBtn.disabled = spinning || n < 2;
  }

  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = $("addInput");
    const name = input.value.trim();
    if (!name || spinning) return;
    const existing = state.items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (existing) existing.on = true;
    else state.items.push({ name, on: true });
    input.value = "";
    persist(); renderList(); draw();
  });

  $("restore").addEventListener("click", () => {
    if (spinning) return;
    state.items.forEach(i => (i.on = true)); persist(); renderList(); draw();
  });
  $("reset").addEventListener("click", () => {
    if (spinning) return;
    state.items = DEFAULTS.map(name => ({ name, on: true }));
    persist(); renderList(); draw();
  });

  const optRemove = $("optRemove"), optSound = $("optSound");
  optRemove.checked = state.removeWinner;
  optSound.checked = state.sound;
  optRemove.addEventListener("change", () => { state.removeWinner = optRemove.checked; persist(); });
  optSound.addEventListener("change", () => { state.sound = optSound.checked; persist(); });

  spinBtn.addEventListener("click", spin);
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); spin(); }
  });

  new ResizeObserver(sizeCanvas).observe(canvas);
  document.fonts?.ready.then(draw);
  renderList();
  sizeCanvas();
  applyRotation();
})();
</script>
</body>
</html>
